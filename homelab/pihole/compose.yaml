services:
  pihole:
    image: pihole/pihole:2026.09.0
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: Europe/Oslo
      FTLCONF_webserver_api_password: "${PIHOLE_WEBPASSWORD:?Set PIHOLE_WEBPASSWORD in .env}"
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - "./data/etc-pihole:/etc/pihole"
    restart: unless-stopped

